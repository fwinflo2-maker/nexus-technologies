    <script>
      (function () {
        var KEY = 'nx_asset_reload';
        var boot = document.getElementById('nx-boot');
        var root = document.getElementById('root');
        var recovering = false;

        function showRecovery(message) {
          if (!boot || recovering) return;
          recovering = true;
          boot.classList.remove('is-done');
          boot.classList.add('is-recovery');
          boot.setAttribute('aria-hidden', 'false');
          boot.innerHTML =
            '<p class="word">NEXUS</p>' +
            '<p class="msg">' + message + '</p>' +
            '<button type="button" id="nx-boot-reload">Recharger</button>';
          var btn = document.getElementById('nx-boot-reload');
          if (btn) btn.onclick = function () { location.reload(); };
        }

        function reloadOnceOrRecover() {
          try {
            if (sessionStorage.getItem(KEY) === '1') {
              sessionStorage.removeItem(KEY);
              showRecovery('Le chargement a échoué (fichiers obsolètes ou réseau). Rechargez la page.');
              return;
            }
            sessionStorage.setItem(KEY, '1');
            location.reload();
          } catch (e) {
            showRecovery('Le chargement a échoué. Rechargez la page.');
          }
        }

        // Uniquement le bundle d'entrée manquant — pas les modulepreload / polices
        // (sinon boucle de reload = splash sans fin).
        window.addEventListener('error', function (ev) {
          var t = ev && ev.target;
          if (!t || t.tagName !== 'SCRIPT') return;
          var src = String(t.src || '');
          if (src.indexOf('/assets/index-') === -1) return;
          reloadOnceOrRecover();
        }, true);

        window.__NX_BOOT_OK = function () {
          if (boot) {
            boot.classList.add('is-done');
            try { boot.remove(); } catch (e) { /* ignore */ }
          }
          try { sessionStorage.removeItem(KEY); } catch (e) { /* ignore */ }
        };

        // Filet : retirer le splash même si React met >2s à charger.
        window.setTimeout(function () {
          if (typeof window.__NX_BOOT_OK === 'function') window.__NX_BOOT_OK();
          if (root && root.childElementCount === 0) {
            reloadOnceOrRecover();
          }
        }, 1500);

        // Filet anti « Chargement… » bloqué (ancien bundle lazy en cache).
        window.setTimeout(function () {
          try {
            var text = (document.body && document.body.innerText) || '';
            var onlyLoading = text.trim() === 'Chargement…' || text.trim() === 'Chargement...';
            if (onlyLoading || (root && root.childElementCount > 0 && text.indexOf('Chargement') === 0 && text.length < 40)) {
              sessionStorage.removeItem(KEY);
              reloadOnceOrRecover();
            }
          } catch (e) { /* ignore */ }
        }, 6000);
      })();
    </script>
